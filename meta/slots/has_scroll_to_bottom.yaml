# ==============================================================================
# LinkML Slot Definition: has_scroll_to_bottom
# ==============================================================================
# Lazy-load trigger (boolean) for the headless capture flow.
# KOS Morocco #476 residual 2 — HeadlessCaptureProfile capture knob.
# CREATED: 2026-07-01
# ==============================================================================

id: https://textpast.com/ontology/rr/slot/has_scroll_to_bottom
name: has_scroll_to_bottom
title: Has Scroll To Bottom
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
imports:
- linkml:types
default_prefix: rr
slots:
  has_scroll_to_bottom:
    slot_uri: rr:hasScrollToBottom
    description: >-
      Whether the capture flow scrolls to the bottom of the page before
      extracting HTML (triggers lazy-loaded content / infinite-scroll elements).
    range: boolean
    required: false
    annotations:
      custodian_types: '["*"]'
