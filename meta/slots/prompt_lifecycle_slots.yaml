id: https://textpast.com/ontology/rr/slots/prompt_lifecycle_slots
name: prompt_lifecycle_slots
title: Prompt Lifecycle Slots
description: >-
  Centralized slots for the PromptLifecycleRecord class (plan
  prompt_corpus_lifecycle_compliance rrp:pl:s6hc8gg5a item 3). All slots are
  defined here and imported by the class file: class files MUST NOT define slots inline (GAC: linkml/general/class-files-no-inline-slots.md,
  CLASS-FILES-001). Slot names are verb-first / noun-singular and
  ontology-neutral (GAC: linkml/naming/slot-naming-convention-current-style.md,
  LINKML-NAMING-001). The slots mirror the corpus frontmatter keys the
  ingester's first-key-wins parser reads
  (crates/hub/api/dev/gac/prompt/src/frontmatter.rs), the contract describes
  the EXISTING tuple, it does not invent a parallel one.
prefixes:
  linkml: https://w3id.org/rr/ontology/linkml/
  rr: https://textpast.com/ontology/rr/

imports:
  - linkml:types
  - ../enums/PromptLifecycleStatusEnum

slots:

  lifecycle_status:
    slot_uri: rr:promptLifecycleStatus
    description: >-
      The prompt's lifecycle state, from PromptLifecycleStatusEnum ONLY (the
      canonical 6-value vocabulary (R3)). Maps the corpus frontmatter `status:`
      key. Prose values are forbidden; historical prose reconciles via the
      enum's alias annotations into this slot, with the original preserved in
      status_note.
    range: PromptLifecycleStatusEnum
    required: true

  concluded_at:
    slot_uri: rr:promptConcludedAt
    description: >-
      ISO-8601 date-time of the terminal transition (maps frontmatter
      `concluded_at:`). REQUIRED when lifecycle_status is a disposition status
      (completed|dismissed), a terminal status without it is a half-transition
      (PROMPT-TERMINAL-AUTHORING-001 R1). FORBIDDEN while non-terminal (a
      non-terminal prompt with a conclusion timestamp is incoherent). Derived
      values carry provenance (the backfill manifest); NEVER backdated silently
      or invented.
    range: datetime
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"

  completed:
    slot_uri: rr:promptCompleted
    description: >-
      true iff the driven work finished (success), the disposition boolean for
      lifecycle_status=completed. Mutually exclusive with dismissed (XOR).
      Required-true when lifecycle_status=completed; absent/false otherwise.
    range: boolean

  dismissed:
    slot_uri: rr:promptDismissed
    description: >-
      true iff the prompt is deemed irrelevant, the disposition boolean for
      lifecycle_status=dismissed. Mutually exclusive with completed (XOR).
      Required-true when lifecycle_status=dismissed; absent/false otherwise.
    range: boolean

  status_note:
    slot_uri: rr:promptStatusNote
    description: >-
      The ORIGINAL status value, verbatim, when a non-canonical value (alias or
      YAML folded prose) was normalized to lifecycle_status, the
      nuance-preserving companion of the alias table (plan item 2: "a
      body-prose note when nuance is lost"). Optional; ABSENT when the
      canonical value was authored directly.
    range: string

  prompt_pid:
    slot_uri: rr:promptPid
    description: >-
      The machine-zone Concept PID (`rrp:pr:<local>`) minted from the file;
      maps the frontmatter `id:` key and the `<!-- Prompt PID: ... -->` marker.
      Shape (coarse lint-level check; the authoritative validator is the
      pid-core codec, crates/hub/api/dev/pid-core/src/codec.rs): payload of
      >=5 base32 symbols (Crockford subset, case-insensitive) plus at most one
      trailing check symbol from the mod-37 check alphabet (`*~$=U/u`).
    range: string
    pattern: "^rrp:pr:[0-9A-Za-z]{5,}[*~$=Uu]?$"
