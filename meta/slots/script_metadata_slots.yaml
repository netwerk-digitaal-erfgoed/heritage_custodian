id: https://textpast.com/ontology/rr/slots/script_metadata_slots
name: script_metadata_slots
title: Script Metadata Slots
description: >-
  Centralized slots for the ScriptMetadata class (E7 of the structured
  session-conclusion plan). All slots are defined here and imported by the class file: class files MUST NOT define slots inline (GAC:
  linkml/general/class-files-no-inline-slots.md, CLASS-FILES-001). Slot names are
  verb-first / noun-singular and ontology-neutral (GAC:
  linkml/naming/slot-naming-convention-current-style.md, LINKML-NAMING-001).
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
  dcterms: http://purl.org/dc/terms/
default_prefix: rr
imports:
  - linkml:types
  - ../enums/ScriptKindEnum
  - ../enums/PrivilegeTierEnum

slots:

  script_path:
    slot_uri: rr:scriptPath
    range: string
    description: >-
      Verbatim FULL repo-relative path to the `scripts/temp/*.sh` artifact
      ({YYYYMMDDTHHMMSS}Z-{identifier}.sh per AGENT-TEMP-SCRIPT-STORAGE-001).
      MUST NOT be truncated with an ellipsis, the timestamp portion is not
      unique (multiple scripts can share one) and the descriptive suffix
      disambiguates, exactly as for docs/prompt/ paths
      (agent-session-documentation.md §6).
    identifier: true
    required: true

  kind:
    slot_uri: rr:scriptKind
    description: >-
      The operational kind of the script (ScriptKindEnum). Derives the operator's
      mental model of what running it does (ceremony / recovery / apply / handoff
      / shred / diagnostic / verify) so the session summary can group scripts by
      kind without the reader opening each file.
    range: ScriptKindEnum
    required: true

  privilege_tier:
    slot_uri: rr:requiresPrivilegeTier
    description: >-
      The privilege tier required to run the script (PrivilegeTierEnum). The
      machine-checkable form of the "one quorum" / "operator-run" / "agent-
      runnable" / "GitOps-only" boundary the convention requires scripts to
      declare in their headers. Lets the operator see which scripts need their
      hands (QUORUM/OPERATOR) vs are agent-runnable (AGENT/GITOPS) at a glance.
    range: PrivilegeTierEnum
    required: true

  idempotent:
    slot_uri: rr:isIdempotent
    description: >-
      Whether the script is safe to re-run (idempotent upserts; a re-run after a
      partial failure converges to the declared state). The ceremony scripts in
      this session are all idempotent (`vault write` is an idempotent upsert; the
      chains flip is a read-reconstruct-write cycle). false means re-running may double-
      apply or compound; the operator must treat it as one-shot.
    range: boolean
    required: true

  purpose:
    slot_uri: rr:hasPurpose
    range: string
    description: >-
      One-line description of what the script accomplishes (the structured form
      of the header's first comment line). The field that turns a list of script
      paths into a readable session-summary section.
    required: true

  source_prompt_path:
    slot_uri: rr:derivedFromPrompt
    description: >-
      The verbatim repo-relative docs/prompt/ artifact the script implements
      (1:1 with AGENT-TEMP-SCRIPT-STORAGE-001's "header MUST cite the verbatim
      source prompt path" requirement). Makes the prompt↔script link auditable in
      both directions. Omit for a script with no source prompt.
    range: string

  prerequisite_summary:
    slot_uri: rr:prerequisiteSummary
    description: >-
      Short human-readable note on the load-bearing prerequisite the script
      assumes (e.g. "access_audience Phase 1+2 must land first, else consumers
      403"; "manifest must be in releases/secrets/ for Flux to apply it"). The
      structured form of a ceremony's --check-prereqs gate.
    range: string

  materialized_in_checkout:
    slot_uri: rr:materializedInCheckout
    description: >-
      Whether the script is present in the operator-facing local checkout (not
      just on origin/main). Mirrors PromptReference.materialized_in_checkout: a
      pushed-but-locally-invisible script is a handoff failure (the operator
      cannot run `bash <path>` they cannot `ls`).
    range: boolean
