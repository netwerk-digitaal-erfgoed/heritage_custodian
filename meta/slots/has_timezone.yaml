# ==============================================================================
# LinkML Slot Definition: has_timezone
# ==============================================================================
# Optional IANA timezone override for the headless capture context.
# KOS Morocco #476 residual 2 — HeadlessCaptureProfile capture knob.
# CREATED: 2026-07-01
# ==============================================================================

id: https://textpast.com/ontology/rr/slot/has_timezone
name: has_timezone
title: Has Timezone
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
imports:
- linkml:types
default_prefix: rr
slots:
  has_timezone:
    slot_uri: rr:hasTimezone
    description: >-
      Optional IANA timezone identifier override for the headless browser
      context (e.g. Asia/Baghdad). When absent, the capture flow derives the
      timezone from the source's country code.
    range: string
    required: false
    annotations:
      custodian_types: '["*"]'
