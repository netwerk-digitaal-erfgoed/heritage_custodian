# ==============================================================================
# LinkML Slot Definition: adopt
# ==============================================================================
# Formally take over a standard or specification issued by another body and
# republish it as one's own, identically or with modifications.
#
# ONTOLOGY ALIGNMENT (verified 2026-10-27 against
# https://www.dublincore.org/specifications/dublin-core/dcmi-terms/dublin_core_terms.ttl
# and https://www.w3.org/ns/prov.ttl):
#
# | Ontology    | Property              | File/Line          | Mapping | Notes                                                       |
# |-------------|-----------------------|--------------------|---------|-------------------------------------------------------------|
# | **DCTerms** | `dcterms:isVersionOf` | dcterms.ttl:655    | close   | "A related resource of which the described resource is a    |
# |             |                       |                    |         | version, edition, or adaptation." An adoption is a version  |
# |             |                       |                    |         | republished under another body's designation.               |
# | **PROV-O**  | `prov:wasDerivedFrom` | prov.ttl:1098      | broad   | An adopted standard is derived from the original.           |
#
# CREATED: 2026-10-27 (plan grc-iso27001-nis2-kos-integration item 5.4 —
# standard variety model; instance: NEN-EN-ISO/IEC 27001:2023 adopts
# ISO/IEC 27001:2022)
# ==============================================================================
id: https://textpast.com/ontology/rr/slot/adopt
name: adopt
title: Adopt
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
default_prefix: rr
imports:
  - linkml:types
slots:
  adopt:
    slot_uri: rr:adopt
    range: uriorcurie
    multivalued: true
    description: >-
      To formally take over a standard, specification or norm issued by another
      body and republish it as one's own (identically or with a regional or national foreword or annex), so that it applies within the adopting
      body's scope.
    alt_descriptions:
      nl: >-
        Het formeel overnemen van een norm, specificatie of standaard van een
        andere organisatie en deze als eigen publicatie uitgeven (ongewijzigd of met een regionaal of nationaal voorwoord of bijlage), zodat deze binnen
        het domein van de overnemende organisatie geldt.
      de: >-
        Eine von einer anderen Stelle herausgegebene Norm, Spezifikation oder
        Regel förmlich übernehmen und als eigene veröffentlichen (unverändert oder mit regionalem oder nationalem Vorwort oder Anhang), sodass sie im
        Zuständigkeitsbereich der übernehmenden Stelle gilt.
      fr: >-
        Reprendre formellement une norme, une spécification ou une règle émise
        par un autre organisme et la publier comme sienne (à l'identique ou avec un avant-propos ou une annexe régionale ou nationale), afin qu'elle
        s'applique dans le périmètre de l'organisme qui l'adopte.
      es: >-
        Asumir formalmente una norma, especificación o regla emitida por otro
        organismo y publicarla como propia (de forma idéntica o con un prólogo o anexo regional o nacional), para que se aplique en el ámbito del
        organismo que la adopta.
      ar: >-
        التبني الرسمي لمعيار أو مواصفة أو قاعدة صادرة عن جهة أخرى وإعادة نشرها باسم الجهة المتبنية (بشكل مطابق أو مع تمهيد أو ملحق إقليمي أو وطني)، بحيث
        تسري ضمن نطاق تلك الجهة.
      id: >-
        Mengambil alih secara resmi suatu standar, spesifikasi, atau norma yang
        diterbitkan oleh badan lain dan menerbitkannya sebagai milik sendiri (secara identik atau dengan kata pengantar atau lampiran regional atau nasional), sehingga berlaku dalam lingkup badan yang mengadopsinya.
      zh: >-
        正式采用另一机构发布的标准、规范或规则，并以本机构名义重新发布（可完全等同，或附加区域或国家前言、附录），使其在采用机构的适用范围内生效。
    structured_aliases:
      - literal_form: overnemen
        predicate: EXACT_SYNONYM
        in_language: nl
      - literal_form: übernehmen
        predicate: EXACT_SYNONYM
        in_language: de
      - literal_form: adopter
        predicate: EXACT_SYNONYM
        in_language: fr
      - literal_form: adoptar
        predicate: EXACT_SYNONYM
        in_language: es
      - literal_form: تبنّي
        predicate: EXACT_SYNONYM
        in_language: ar
      - literal_form: mengadopsi
        predicate: EXACT_SYNONYM
        in_language: id
      - literal_form: 采用
        predicate: EXACT_SYNONYM
        in_language: zh
    close_mappings:
      - dcterms:isVersionOf
    broad_mappings:
      - prov:wasDerivedFrom
    comments:
      - "Directional: the subject is the adopting publication (e.g. NEN-EN-ISO/IEC 27001:2023), the object the adopted original (ISO/IEC 27001:2022)."
      - "The variety node carrying this edge is typed REGIONAL_ADOPTION in StandardVarietyKindEnum."
    annotations:
      specificity_score: 0.35
      specificity_rationale: Publication relation reusable for any standards-body adoption (EN, NEN, DIN, BSI adoptions of ISO/IEC works)
      custodian_types: '["*"]'
