id: https://textpast.com/ontology/rr/slot/has_user_agent
name: has_user_agent
title: Has User Agent
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
imports:
- linkml:types
default_prefix: rr
slots:
  has_user_agent:
    slot_uri: rr:hasUserAgent
    description: >-
      Desktop User-Agent header override applied to the headless browser
      context. Defeats bot-detection on ASP.NET WebForms / GIS portals that
      reject the default headless UA. None = browser default.
    range: string
    required: false
    annotations:
      custodian_types: '["*"]'
