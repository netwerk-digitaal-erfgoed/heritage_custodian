# ==============================================================================
# LinkML Slot Definition: has_content_selector
# ==============================================================================
# CSS selector scoping the extracted content element for the headless capture.
# KOS Morocco #476 residual 2 — HeadlessCaptureProfile capture knob.
# CREATED: 2026-07-01
# ==============================================================================

id: https://textpast.com/ontology/rr/slot/has_content_selector
name: has_content_selector
title: Has Content Selector
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
imports:
- linkml:types
default_prefix: rr
slots:
  has_content_selector:
    slot_uri: rr:hasContentSelector
    description: >-
      CSS selector of the content element to extract after render. None = full
      page HTML. Scopes the captured DOM subtree for downstream decode.
    range: string
    required: false
    annotations:
      custodian_types: '["*"]'
