# ==============================================================================
# LinkML Slot Definition: has_locale
# ==============================================================================
# Optional locale override for the headless capture context.
# KOS Morocco #476 residual 2 — HeadlessCaptureProfile capture knob.
# CREATED: 2026-07-01
# ==============================================================================

id: https://textpast.com/ontology/rr/slot/has_locale
name: has_locale
title: Has Locale
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
imports:
- linkml:types
default_prefix: rr
slots:
  has_locale:
    slot_uri: rr:hasLocale
    description: >-
      Optional BCP-47 locale override for the headless browser context (e.g.
      ar-IQ). When absent, the capture flow derives the locale from the source's
      country code.
    range: string
    required: false
    annotations:
      custodian_types: '["*"]'
