# ==============================================================================
# LinkML Slot Definition: has_wait_selector
# ==============================================================================
# CSS selector indicating JS render completion for the headless capture flow.
# KOS Morocco #476 residual 2 — HeadlessCaptureProfile capture knob.
# CREATED: 2026-07-01
# ==============================================================================

id: https://textpast.com/ontology/rr/slot/has_wait_selector
name: has_wait_selector
title: Has Wait Selector
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
imports:
- linkml:types
default_prefix: rr
slots:
  has_wait_selector:
    slot_uri: rr:hasWaitSelector
    description: >-
      CSS selector indicating that JavaScript rendering is complete (e.g. the
      map canvas or container has mounted). Drives the headless capture flow's
      wait-for-render step before extracting HTML.
    range: string
    required: false
    annotations:
      custodian_types: '["*"]'
