id: https://textpast.com/ontology/rr/slots/session_handoff_spawn_slots
name: session_handoff_spawn_slots
title: Session Handoff Spawn Decision Slots
description: >-
  Centralized slots for the SessionHandoffSpawnDecision class, the
  spawn-or-arm-or-explain section that closes every SessionConclusion (the
  LAST branch of the umbrella, per the 2026-08-26 operator directive: "add a
  section in the end of session conclusion/report that explains why a handoff
  was or was not spawned"). External best practice: a handoff is a CONTRACT: trigger conditions, source, target, context payload, idempotency, and
  failure-recovery documented machine-readably (AWS Well-Architected Agentic
  AI Lens AGENTOPS01-BP02; OpenAI Agents orchestration "Handoffs" pattern).
  All slots defined here and imported by the class file (CLASS-FILES-001).
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
default_prefix: rr
imports:
  - linkml:types
  - ../enums/HandoffSpawnDispositionEnum
  - ../enums/SpawnDispatchStatusEnum

slots:

  handoff_ref:
    slot_uri: rr:handoffRef
    description: >-
      The handoff artifact this decision is about, the verbatim repo-relative
      `docs/prompt/<file>.md` path of the AUTHORED successor/auxiliary prompt.
      REQUIRED for every disposition except `none`. MULTI-VEHICLE (#362959):
      this is ONE of the close's forward vehicles, not necessarily the only one: every AUTHORED prompts[] entry is also a vehicle, and under
      disposition gate_at_quit the green-respawn gate evaluates and spawns
      every P1–P6-eligible vehicle (this one via the P2d conclusion-decision
      edge). Typical dual-vehicle shape: AUTHORED re-land vehicles owned by
      live watchers + this handoff_ref naming the substantive chain head.
    range: string

  handoff_spawn_disposition:
    slot_uri: rr:handoffSpawnDisposition
    description: >-
      The spawn disposition (HandoffSpawnDispositionEnum): spawned_now,
      auto_spawn_armed, operator_manual, or none. REQUIRED. This is the single
      field every spawner (green-respawn P1, the operator, the Condition
      Watcher resume) reads first: it answers "why is (or is not) a successor
      session running right now?"
    range: HandoffSpawnDispositionEnum
    required: true

  handoff_spawn_mechanism:
    slot_uri: rr:handoffSpawnMechanism
    description: >-
      HOW the spawn happens or would happen, e.g. "green-respawn-on-quit
      P1–P6 (validated-GREEN only)", "blocked-trigger <id> spawn_agent
      resume", "manual rrpi <path> (operator one-liner)". Omit when identical
      to the disposition's obvious reading.
    range: string

  handoff_spawn_trigger_condition:
    slot_uri: rr:handoffSpawnTriggerCondition
    description: >-
      For auto_spawn_armed: the machine-detectable condition that releases the
      spawn, expressed as a closed-catalog ConditionKind + params (e.g.
      git_ref_quiescent, flux_helmrelease_ready). For operator_manual: the
      human gate or the UNSATISFIABLE machine gate (named + cited in
      unmet_preconditions). Empty for spawned_now/none.
    range: string

  handoff_spawn_trigger_ref:
    slot_uri: rr:handoffSpawnTriggerRef
    description: >-
      The durable watcher reference proving an auto_spawn_armed disposition is
      REALLY armed, the blocked-trigger id (26-char ULID), Condition Watcher
      schedule name, or wake target. REQUIRED iff disposition is
      auto_spawn_armed (an "armed" claim with no reference is an
      unverifiable self-attestation).
    range: string

  handoff_spawn_unmet_preconditions:
    slot_uri: rr:handoffSpawnUnmetPreconditions
    description: >-
      The named preconditions the successor's OWN first actions depend on
      (e.g. "generative-model-provider serving completions"), each citing its
      settlement: a Forgejo #NNN (the condition-kind gap / the owning
      finding), a detector, or an explicit (non-actionable: ...) disposition.
      Same citation discipline as the residual audit
      (AGENT-CLOSEOUT-RESIDUAL-AUDIT-001 §1).
    range: string
    multivalued: true

  handoff_spawn_rationale:
    slot_uri: rr:handoffSpawnRationale
    description: >-
      WHY this disposition was chosen, the answer to "was this not spawned
      automatically?". MUST name the gate for operator_manual (the human-only
      step or the missing catalog predicate); MUST state the release condition
      for auto_spawn_armed. REQUIRED. A handoff that is neither spawned, armed,
      nor explained is an undecided leftover, the exact failure the
      spawn-or-arm-or-explain contract forbids.
    range: string
    required: true

  handoff_launch_command:
    slot_uri: rr:handoffLaunchCommand
    description: >-
      The exact rrpi launch command that starts the successor on the handoff
      artifact: `rrpi spawn <docs/prompt/path>` (a new tmux tab on the shared
      rootreal-agents surface, the green-respawn spawn form) or
      `rrpi <docs/prompt/path>` (in-place). REQUIRED whenever handoff_ref is
      present (the 2026-09-01 operator directive: a conclusion whose plan
      STAYS ACTIVE is followed by the authored successor prompt AND its
      launch command AND (when the outcome light is green) the automatic
      spawn; handoff-as-contract: a receiver must never re-derive the launch
      surface (AWS Agentic AI Lens AGENTOPS01-BP02) "a handoff is a data
      contract before it is a workflow step").
    range: string

  spawn_dispatch_status:
    slot_uri: rr:spawnDispatchStatus
    description: >-
      The up-front dispatch status (SpawnDispatchStatusEnum) the session's
      FINAL SUMMARY and this record MUST state BEFORE any launch command;
      landed / armed_blocked_watch / gate_pending / manual_pending /
      not_dispatched (operator directive 2026-09-28,
      AGENT-HANDOFF-AUTOSPAWN-STATUS-FIRST-001). The dated defect: a close
      whose spawn was armed-but-blocked led its summary with the manual
      `rrpi docs/prompt/<file>` line (the §6 revival fallback), the operator
      read "you must launch this" although a persistent watch owned the
      auto-spawn. REQUIRED (validator L2, effective 2026-09-28) whenever the
      disposition is spawned_now or auto_spawn_armed; under any status other
      than manual_pending the launch command in the record is a FALLBACK,
      never the implied next step.
    range: SpawnDispatchStatusEnum

  spawn_watch_ref:
    slot_uri: rr:spawnWatchRef
    description: >-
      The durable reference of the retry machinery owning an armed spawn:
      the rr-spawn-wait marker/log id (e.g. wait-680606743), the blocked-trigger
      ULID, or the Condition Watcher schedule name. REQUIRED (validator L2,
      effective 2026-09-28) when spawn_dispatch_status is armed_blocked_watch:
      an "armed, no action needed" claim with no watchable reference is an
      unverifiable self-attestation (same discipline as
      handoff_spawn_trigger_ref for auto_spawn_armed).
    range: string

  handoff_spawn_evidence_refs:
    slot_uri: rr:handoffSpawnEvidenceRefs
    description: >-
      Evidence backing the disposition, the spawned session's agent_id/tab,
      the trigger registration receipt, the issue that owns the unmet
      precondition.
    range: string
    multivalued: true
