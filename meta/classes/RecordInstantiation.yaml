# ==============================================================================
# LinkML Class Definition: RecordInstantiation
# ==============================================================================
# ONE concrete form of an abstract DocumentRecord — the docx original, an md
# derivative, a pdf rendering. Carries its own identity (path, format,
# sha256, size) and full derivative/creation metadata.
#
# ONTOLOGY ALIGNMENT (verified 2026-10-06, plan readlist-record-instantiation-model
# item 1.3, against the in-repo RiC-O vocabulary + PREMIS 3.0):
#
# | Ontology | Class / concept               | File/Line / Source             | Mapping | Notes                                     |
# |----------|-------------------------------|--------------------------------|---------|---------------------------------------------|
# | **RiC-O**| `rico:Instantiation`          | RiC-O_1-1.rdf:26263-26346      | close   | "The inscription of information made by    |
# |          |                               |                                |         | an Agent on a physical carrier in any       |
# |          |                               |                                |         | persistent, recoverable form".              |
# | **PREMIS**| Object (bitstream/file)      | PREMIS DD v3.0, Object entity  | close   | Fixity (sha256), format, derivation         |
# |          |                               |                                |         | relationships, conversion events.           |
#
# Derivation metadata (is_derivative, derivative_of, converted_at, converter,
# source_sha256) follows PREMIS object→event→agent semantics: the conversion
# block IS the event record (RECORD-INSTANTIATION-REGISTRY-001 rule 2).
#
# CREATED: 2026-10-06 (plan readlist-record-instantiation-model, item 1.3)
# ==============================================================================

id: https://textpast.com/ontology/rr/classes/RecordInstantiation
name: RecordInstantiation
title: Record Instantiation Class
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
  rico: https://www.ica.org/standards/RiC/ontology#
  dcterms: http://purl.org/dc/terms/
default_prefix: rr
imports:
  - linkml:types
  - ../slots/has_url
  - ../slots/has_format
  - ../slots/has_size
  - ../slots/has_file_location
  - ../slots/is_derivative
  - ../slots/derivative_of
  - ../slots/converted_at
  - ../slots/converter
  - ../slots/source_sha256
  - ../slots/has_date
classes:
  RecordInstantiation:
    class_uri: rr:RecordInstantiation
    description: >-
      One concrete instantiation of an abstract record — the bit-preserved
      original file or a derivative produced from it by a governed
      conversion. Carries identity (location, format, size), fixity
      (sha256), and — for derivatives — the full derivation metadata
      (derivative_of, converter, converted_at).
    alt_descriptions:
      nl: >-
        Eén concrete instantie van een abstract record — het bitgetrouw
        bewaarde originele bestand of een afleiding daarvan, geproduceerd door
        een beheerde conversie.
      de: >-
        Eine konkrete Instanziierung eines abstrakten Datensatzes — die
        bitgetreu bewahrte Originaldatei oder eine daraus durch eine
        geregelte Konvertierung erzeugte Ableitung.
      fr: >-
        Une instanciation concrète d'un enregistrement abstrait — le fichier
        original préservé au bit près ou une dérivation produite par une
        conversion gouvernée.
      es: >-
        Una instanciación concreta de un registro abstracto — el archivo
        original preservado bit a bit o un derivado producido por una
        conversión gobernada.
      ar: >-
        تجسيد ملموس لسجل مجرد — الملف الأصلي المحفوظ بتًا ببت أو اشتقاق ناتج عن تحويل مُدار.
      id: >-
        Satu instansiasi konkret dari catatan abstrak — berkas asli yang
        diawetkan bit-per-bit atau turunan yang dihasilkan oleh konversi
        yang terkelola.
      zh: >-
        抽象记录的一个具体实例化——逐位保存的原始文件，或通过受治理转换产生的衍生件。
    structured_aliases:
    - literal_form: recordinstantie
      predicate: EXACT_SYNONYM
      in_language: nl
    - literal_form: Datensatzinstanziierung
      predicate: EXACT_SYNONYM
      in_language: de
    - literal_form: instanciation d'enregistrement
      predicate: EXACT_SYNONYM
      in_language: fr
    - literal_form: instanciación de registro
      predicate: EXACT_SYNONYM
      in_language: es
    - literal_form: تجسيد السجل
      predicate: EXACT_SYNONYM
      in_language: ar
    - literal_form: instansiasi catatan
      predicate: EXACT_SYNONYM
      in_language: id
    - literal_form: 记录实例化
      predicate: EXACT_SYNONYM
      in_language: zh
    slots:
      - has_file_location
      - has_format
      - has_size
      - is_derivative
      - derivative_of
      - source_sha256
      - has_date
      - converted_at
      - converter
      - has_url
    slot_usage:
      has_file_location:
        description: >-
          The registry-relative path of the instantiation file (e.g.
          `Voorbeelden AI.docx` inside the record's corpus directory).
      is_derivative:
        required: true
        description: >-
          False for the bit-preserved original; true for every converted
          derivative.
      derivative_of:
        description: >-
          The instantiation id this derivative was derived from; null
          (absent) for originals.
      source_sha256:
        required: true
        description: >-
          SHA-256 of this instantiation's own bytes (64 lowercase hex).
      converted_at:
        description: >-
          PREMIS conversion-event timestamp; present for derivatives.
      converter:
        description: >-
          Stable pipeline + specification identity that performed the
          conversion; present for derivatives.
    close_mappings:
      - rico:Instantiation
    related_mappings:
      - premis:Object
