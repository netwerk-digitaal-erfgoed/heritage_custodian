id: https://textpast.com/ontology/rr/class/SwarmTaskIdentity
name: SwarmTaskIdentity
title: Swarm Task Identity Class
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
default_prefix: rr
imports:
  - linkml:types
  - ../slots/swarm_task_claim_slots
classes:
  SwarmTaskIdentity:
    class_uri: rr:SwarmTaskIdentity
    description: >-
      Canonical structured task identity used by Swarm MCP to distinguish exact
      duplicate work from sibling task slices.
    slots:
      - task_key
      - task_fingerprint
      - task_kind
      - plan_id
      - phase_number
      - item_index
      - prompt_path
      - non_goals
    slot_usage:
      task_key:
        required: false
      task_fingerprint:
        required: false
      non_goals:
        multivalued: true
