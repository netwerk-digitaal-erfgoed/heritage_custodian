id: https://textpast.com/ontology/rr/class/ScriptMetadata
name: ScriptMetadata
title: Script Metadata
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
default_prefix: rr
imports:
  - linkml:types
  - ../enums/ScriptKindEnum
  - ../enums/PrivilegeTierEnum
  - ../slots/script_metadata_slots
default_range: string

classes:
  ScriptMetadata:
    class_uri: rr:ScriptMetadata
    description: >-
      A structured reference to a `scripts/temp/*.sh` artifact cited in a session
      conclusion (element E7 of the structured session-conclusion plan). Captures
      the bash-script metadata the operator needs to triage a session's landed
      scripts without opening each file: its operational kind, its privilege
      tier (the machine-checkable form of the "one quorum" / "agent-runnable"
      boundary), idempotency, purpose, and the source prompt it implements.
      Implements AGENT-TEMP-SCRIPT-STORAGE-001 (v1.3.0: write-before-paste +
      read-only/diagnostic blocks count) in machine-checkable form, mirroring how
      PromptReference (E1) implements AGENT-SESSION-DOC-001 §6.
    slots:
      - script_path
      - kind
      - privilege_tier
      - idempotent
      - purpose
      - source_prompt_path
      - prerequisite_summary
      - materialized_in_checkout
    comments:
      - "script_path MUST be the verbatim full path, never truncated with an ellipsis (timestamps are not unique), exactly as for prompt_path."
      - "privilege_tier is the load-bearing field for the operator triage: QUORUM/OPERATOR need their hands; AGENT/GITOPS don't."
      - "idempotent=true means re-runnable (safe); the ceremony scripts (vault write upserts) are all idempotent."
      - "source_prompt_path mirrors the script header's mandatory source-prompt citation (AGENT-TEMP-SCRIPT-STORAGE-001); omit only when there is no source prompt."
      - "materialized_in_checkout=false means the operator cannot `bash <path>` they cannot `ls`, a handoff failure."
    examples:
      - value:
          script_path: "scripts/temp/20260627T011245Z-vault-358-b2-ceremony.sh"
          kind: "CEREMONY"
          privilege_tier: "QUORUM"
          idempotent: true
          purpose: "Mint a transient root from 5/3 recovery keys, write the vault-snapshot policy + k8s-auth role, verify, revoke."
          source_prompt_path: "docs/prompt/20260626T165835Z_vault-358-followups-result-and-b2-snapshot-spec.md"
          prerequisite_summary: "port-forward up; operator-driven gpg decrypts (the quorum)."
          materialized_in_checkout: true
        description: "The B2 vault-snapshot ceremony: one quorum, idempotent, operator-gated."
      - value:
          script_path: "scripts/temp/20260627T131515Z-chains-audience-vault-flip-v2.sh"
          kind: "CEREMONY"
          privilege_tier: "QUORUM"
          idempotent: true
          purpose: "Flip the tekton-chains-signer role to audience=vault; backoff-aware watch for the vault-agent to re-auth."
          source_prompt_path: "docs/prompt/20260627T015209Z_access-audience-plan-implementation-handoff.md"
          prerequisite_summary: "access_audience Phase 1 (apiserver --api-audiences includes 'vault') must land first, else the watch never clears."
          materialized_in_checkout: true
        description: "The v2 chains audience-flip ceremony fixes the v1 3m-watch false-negative; idempotent role upsert."
      - value:
          script_path: "scripts/temp/20260627T082220Z-vault-358-task-a-custody-and-shred.sh"
          kind: "SHRED"
          privilege_tier: "OPERATOR"
          idempotent: false
          purpose: "Categorized stale-DR-file shred (30 files, 5 categories) + PGP custody checklist; --dry-run default, per-file confirm."
          source_prompt_path: "docs/prompt/20260626T165835Z_vault-358-followups-result-and-b2-snapshot-spec.md"
          prerequisite_summary: "Destructive — confirm the transit-vault-20251125 file is PGP-escrowed before shredding (DEFCON-1)."
          materialized_in_checkout: true
        description: "Task A custody + shred: operator-destructive, NOT idempotent, no quorum."
