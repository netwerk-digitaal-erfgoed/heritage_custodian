id: https://textpast.com/ontology/rr/class/AmbientNote
name: AmbientNote
title: Ambient Note (session-end observation, noted-not-chased)
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov/
default_prefix: rr
imports:
  - linkml:types
  - ../enums/AmbientNoteCategoryEnum
  - ../slots/ambient_note_slots
default_range: string

classes:
  AmbientNote:
    class_uri: rr:AmbientNote
    description: >-
      An observation a session surfaces in its end-of-session report that it did
      NOT chase (out of scope, not its task, or the owner is another
      session/component) but that is worth recording for the next agent/operator
      — e.g. an ambient dependency alert (Vault degraded, observed via the
      session-start digest or a resolver fallback), a stale Swarm finding
      persisting past recovery, ambient worktree/checkout drift, an
      observed-but-uninvestigated anomaly, notable peer/cluster activity.

      DISTINCT FROM SessionHazard: a SessionHazard is a latent condition IN THIS
      SESSION'S OWN WORK that will bite a future agent (stale-base regen,
      silent no-op, a guard gap the session hit). An AmbientNote is about the
      AMBIENT environment/state the session OBSERVED but does NOT own — the
      session's own work is unaffected (or survived via a fallback); the note
      routes the observation to its owner. Hazards the session owns; ambient
      notes the session witnesses.

      Carrying ambient observations STRUCTURALLY (vs ad-hoc "ℹ️ Ambient note"
      chat prose) closes the silent-ambient-signal failure mode: an observation
      that lives only in chat is invisible to the next session's structured
      ingest, unreconcilable, and re-discovered from scratch each session. The
      `ambient_note_dedup_key` lets a downstream consumer match a note to a
      Swarm finding / Prometheus alert / Forgejo issue + resolve it when the
      condition clears (the STALE_FINDING reconciliation cure). The
      `ambient_note_disposition` names the owner + next-step so the note is
      actionable, not a dangling complaint. This class is the schema-tier
      structuralization of AGENT-SESSION-AMBIENT-NOTE-001.
    slots:
      - ambient_note_category
      - ambient_note_severity
      - ambient_note_component
      - ambient_note_observation
      - ambient_note_disposition
      - ambient_note_dedup_key
      - ambient_note_observed_at
      - ambient_note_reference
      - ambient_note_remediation_plan
    comments:
      - "Only `ambient_note_category` and `ambient_note_observation` are required; every other slot may be absent."
      - "`ambient_note_severity` uses the Swarm vocabulary (info|warning|critical); a DEPENDENCY_ALERT the session survived via fallback is still warning/critical for the FLEET, not info."
      - "`ambient_note_dedup_key` is recommended for DEPENDENCY_ALERT + STALE_FINDING so a consumer can reconcile (e.g. match `infra-failure:vault` to the Swarm finding + resolve it on recovery)."
      - "An AmbientNote is NOT a license to skip work the session OWNS — it is for observations the session does not own. Owned hazards go in `hazards`; owned remaining-work goes in `remaining`."
    examples:
      - value:
          ambient_note_category: STALE_FINDING
          ambient_note_severity: critical
          ambient_note_component: vault
          ambient_note_observation: "3 CRITICAL infra-failure findings (infra-failure:vault/forgejo/harbor) still surfaced in the session-start digest ~8h after posting; vault status now shows Sealed=false (recovered) + the resolver is no longer logging fallback — the findings are stale (persisting past recovery)."
          ambient_note_disposition: "Out of scope (this session's git pushes landed via dotenv bootstrap). Routed to the infra owner via a docs/prompt investigation handoff (root-cause the ~3h-ago Vault restart + reconcile the stale findings + harden the auto-resolve-on-recovery path)."
          ambient_note_dedup_key: infra-failure:vault
          ambient_note_observed_at: "2026-07-23T07:39:00Z"
          ambient_note_reference: "docs/prompt/20260723T074500Z_vault-critical-findings-stale-restart-investigation.md"
        description: "A STALE_FINDING ambient note — the canonical instance that motivated this class (the 2026-07-23 Vault findings persisting past recovery)."
      - value:
          ambient_note_category: OUT_OF_SCOPE_REMEDIATION
          ambient_note_severity: warning
          ambient_note_component: prompt_template
          ambient_note_observation: "prompt_template_get_prompt(rrp:pr:zf6fs30g0) returns 'prompt not found' for a valid, on-origin/main, status: completed prompt — the prompt-instance projection is ~4.73d stale (exceeds the 8h conclude_prompt max). The FILE frontmatter is correct; the projection is a stale cache. Surfaced while verifying an unrelated completed prompt; this session does not own the projection pipeline."
          ambient_note_disposition: "Out of scope (this session verified rrp:pr:zf6fs30g0, not the projection pipeline). Routed to the infra owner via an out-of-scope-issue-observation docs/prompt + a NEW Plan MCP plan (root-cause the projection staleness, add a freshness/self-healing guard, unbreak conclude_prompt)."
          ambient_note_dedup_key: prompt-mcp-instance-projection-stale
          ambient_note_observed_at: "2026-07-24T15:40:00Z"
          ambient_note_reference: "docs/prompt/20260724T144600Z_prompt-instance-projection-stale-typedb-rename-consumer-audit.md"
          ambient_note_remediation_plan: "prompt_projection_typedb_rename_audit"
        description: "An OUT_OF_SCOPE_REMEDIATION ambient note — the canonical instance (the 2026-07-24 prompt-instance projection staleness surfaced while concluding rrp:pr:zf6fs30g0; routed to plan rrp:pl:8zgyhnt76 / prompt rrp:pr:w3p43pkmg)."
