id: https://textpast.com/ontology/rr/class/ProvenancePromptChain
name: ProvenancePromptChain
title: Provenance Prompt Chain
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
default_prefix: rr
imports:
  - linkml:types
  - ../slots/session_provenance_slots
default_range: string

classes:
  ProvenancePromptChain:
    class_uri: rr:ProvenancePromptChain
    description: >-
      The prompt-chain linkages a mined session carries, the rrp:pr: prompt PIDs
      + the docs/prompt/ paths ordered by their origin/main mtime (chain
      adjacency). Composes into SessionProvenance as its `prompt_chain` sub-record
      (FU3 part a). The prev/next ADJACENCY is modelled separately
      (ProvenancePromptAdjacency) because succeeding_prompt is a cross-session join
      the archive performs, not the miner.
    slots:
      - prompt_pids
      - prompt_paths
    comments:
      - "prompt_paths are ordered by origin/main mtime, i.e. the chain's adjacency order, not citation order."
