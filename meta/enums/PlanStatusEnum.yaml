id: https://textpast.com/ontology/rr/enum/PlanStatusEnum
name: PlanStatusEnum
title: Plan Status Enum
description: >-
  The lifecycle status of an ImplementationPlan, read from a typed field, never
  inferred from prose or checkbox glyphs. Aligns with the version-PID canonical
  recipe (PLAN-PID-001: canonical_plan_bytes hashes `status`) and the alteration
  model "revise vs supersede, never delete". Implements
  PLAN-SCHEMATA-OVER-HEURISTICS-001 (status as a typed enum, the structural cure
  for heuristic glyph + prose inference).
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
default_prefix: rr

enums:
  PlanStatusEnum:
    description: >-
      Lifecycle status of an ImplementationPlan (ImplementationPlan.status, pinned
      via slot_usage). Carries the same vocabulary the gac/plan ingestion pipeline
      reads directly from the schemata, not a `[ ]`/`[x]` glyph parse.
    permissible_values:
      draft:
        description: Authored but not yet active; structure may still be in flux.
      active:
        description: Actively being executed; checklist items advancing.
      complete:
        description: All checklist items completed and verified.
      superseded:
        description: >-
          Replaced by a successor plan (PLAN-PID-001 supersede lineage; the
          successor's `supersedes` field points here). Retained, never deleted.
      archived:
        description: Frozen under docs/plan/archive/; out of active scope.
