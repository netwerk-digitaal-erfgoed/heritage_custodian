id: https://textpast.com/ontology/rr/enum/SwarmClaimStatusEnum
name: SwarmClaimStatusEnum
title: Swarm Claim Status Enumeration
imports:
  - linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
default_prefix: rr
enums:
  SwarmClaimStatusEnum:
    description: >-
      Lifecycle states for exact Swarm task claims.
    permissible_values:
      active:
        description: Claim is currently held by a live agent.
      released:
        description: Claim was released cleanly by the owning agent.
      stale:
        description: Claim expired because the owner went stale.
      superseded:
        description: Claim was replaced by a newer generation.
