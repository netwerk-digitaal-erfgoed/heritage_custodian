# FacialExpressionCultureContextEnum — cultural frame for facial-action→emotion mappings
#
# The spatial/cultural context under which a facial-action → emotion association is
# attested. Facial-expression → emotion inference is NOT culturally universal
# (Jack et al. 2012, PNAS doi:10.1073/pnas.1200155109), so every mapping MUST name
# the cultural frame under which it holds. This enum is deliberately OPEN: new
# cultural contexts are added as data (new permissible values + new source bundles),
# never by changing mapping/emission code (GAC KOS-MAP-CONTEXT-001).
#
# Created: 2026-06-08

id: https://textpast.com/ontology/rr/enum/FacialExpressionCultureContextEnum
name: FacialExpressionCultureContextEnum
title: Facial Expression Culture Context Enumeration

prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
  skos: http://www.w3.org/2004/02/skos/core#
  prov: http://www.w3.org/ns/prov#

default_prefix: rr

imports:
  - linkml:types

enums:
  FacialExpressionCultureContextEnum:
    description: |
      Cultural/regional frame under which a facial-action → emotion association is
      attested. Required on every facial-expression mapping: there is no
      culture-neutral default, because the universality thesis is refuted
      (Jack et al. 2012). Open enumeration — extend with new contexts as data.
    permissible_values:
      Western:
        description: |
          Western (predominantly European/North-American, WEIRD-sampled) facial-
          expression representations. The frame of the EMFACS basic-emotion
          prototypes (Friesen & Ekman 1983; Ekman, Friesen & Hager 2002).
        annotations:
          source_bundle: "schemata/source/custodian/us_ca_sfo_c_peg/emfacs"
          category: "culture_context"
      EastAsian:
        description: |
          East-Asian facial-expression representations (Jack et al. 2012). Show
          category overlap (surprise/fear/disgust/anger not distinct) and convey
          emotional intensity through early eye-region dynamics — distinct from the
          Western prototypes, demonstrating non-universality.
        annotations:
          source_bundle: "schemata/source/custodian/gb_sct_gla_e_uog/cultural_expression_models"
          category: "culture_context"
      CrossCultural:
        description: |
          A comparative/cross-cultural claim spanning more than one culture context,
          or an association explicitly studied across cultures.
        annotations:
          category: "culture_context"
      Unspecified:
        description: |
          Cultural frame not yet determined. Use ONLY for legacy data pending
          re-attestation; a production mapping MUST name a specific context.
        annotations:
          category: "culture_context"
          is_provisional: "true"
