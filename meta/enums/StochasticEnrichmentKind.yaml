id: https://textpast.com/ontology/rr/enum/StochasticEnrichmentKind
name: StochasticEnrichmentKind
title: Stochastic Enrichment Kind
description: >-
  Kinds of stochastic enrichment that produce versioned rows over heritage
  material (plan `oclc-287759-heritage-ingestion` item 3.5,
  DATA-STOCHASTIC-ENRICHMENT-VERSIONING-001). All of them are stochastic
  by construction (different runs/models/corrections produce different
  outputs), hence endless versions, never one canonical row.
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/

enums:
  StochasticEnrichmentKind:
    description: Which stochastic process produced a version row
    permissible_values:
      TRANSCRIPTION:
        description: >-
          Handwritten-text recognition or manual transcription of text content
          (e.g. a Transkribus HTR transcript of a page).
      LAYOUT_ANALYSIS:
        description: >-
          Layout/segmentation analysis of a page (regions, baselines, reading order), e.g. a Transkribus/Laypa layout pass.
      SEMANTIC_IMAGE:
        description: >-
          Image-describing semantic metadata (e.g. ICONCLASS classification of
          a page or region).
      OCR_WHERE_ABSENT:
        description: >-
          Optical character recognition run ONLY where legacy transcription is
          absent, a RootReal-run stochastic enrichment, versioned identically.
