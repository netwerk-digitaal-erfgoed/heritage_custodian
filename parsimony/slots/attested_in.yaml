id: https://textpast.com/ontology/rr/parsimony/slot/attested_in
name: attested_in
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  owl: http://www.w3.org/2002/07/owl#
default_prefix: rr
imports:
  - linkml:types
slots:
  attested_in:
    slot_uri: dcterms:source
    description: Links an entity, observation, or claim to a source in which it is attested or documented.
    range: SourceResource
    inverse: attests
    implements:
      - owl:ObjectProperty
    multivalued: true
    close_mappings:
      - prov:used
    narrow_mappings:
      - rr:has_source
