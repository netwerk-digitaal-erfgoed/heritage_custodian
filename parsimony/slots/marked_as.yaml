id: https://textpast.com/ontology/rr/parsimony/slot/marked_as
name: marked_as
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
  schema: https://schema.org/
  owl: http://www.w3.org/2002/07/owl#
default_prefix: rr
imports:
  - linkml:types
slots:
  marked_as:
    slot_uri: rr:hasStatus
    description: Marks an entity with a current state, standing, or descriptive status relevant to interpretation or access.
    range: string
    implements:
      - owl:DatatypeProperty
    multivalued: true
    related_mappings:
      - schema:status
    narrow_mappings:
      - rr:has_status
