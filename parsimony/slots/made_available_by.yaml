id: https://textpast.com/ontology/rr/parsimony/slot/made_available_by
name: made_available_by
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
  dcterms: http://purl.org/dc/terms/
  schema: https://schema.org/
  owl: http://www.w3.org/2002/07/owl#
default_prefix: rr
imports:
  - linkml:types
slots:
  made_available_by:
    slot_uri: dcterms:publisher
    description: Relates a semantic resource to the agent that publishes, issues, or otherwise makes it available.
    range: Agent
    inverse: makes_available
    implements:
      - owl:ObjectProperty
    multivalued: true
    close_mappings:
      - schema:publisher
    narrow_mappings:
      - rr:has_publisher
