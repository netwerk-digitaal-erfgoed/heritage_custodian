id: https://textpast.com/ontology/rr/parsimony/slot/received_from
name: received_from
prefixes:
  linkml: https://w3id.org/linkml/
  rr: https://textpast.com/ontology/rr/
  crm: http://www.cidoc-crm.org/cidoc-crm/
  schema: https://schema.org/
  owl: http://www.w3.org/2002/07/owl#
default_prefix: rr
imports:
  - linkml:types
slots:
  received_from:
    slot_uri: rr:receivedFrom
    description: Indicates the source agent or place from which custody, possession, or a resource is received in a transfer context.
    range: Agent
    inverse: passed_to
    implements:
      - owl:ObjectProperty
    multivalued: true
    narrow_mappings:
      - crm:P27_moved_from
      - crm:P28_custody_surrendered_by
      - schema:fromLocation
      - rr:transferred_from
